name: 构建 Android APK

# 触发方式：手动点「Run workflow」，或 app/www 里的内容有改动时自动构建
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/www/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    # 固定 24.04 而不用 ubuntu-latest：GitHub 从 2026-10-19 起把 ubuntu-latest 逐步切到 Ubuntu 26，
    # 构建环境会悄悄变。哪天 24.04 被淘汰导致失败，把下面这行改成 ubuntu-latest 即可。
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 准备 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安装 Capacitor 依赖
        working-directory: app
        run: npm install

      - name: 生成 Android 工程并同步网页资源
        working-directory: app
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: 构建 Debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v6
        with:
          name: 截面实验台-Android-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
